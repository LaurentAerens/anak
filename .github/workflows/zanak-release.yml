name: Zanak Release

on:
  push:
    tags:
      - 'zanak-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Zanak tag or version (e.g. zanak-v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test-and-verify:
    name: Test & Zanak Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Zanak in Release mode
        run: dotnet build src/Zanak/Zanak.csproj -c Release --no-restore

      - name: Run unit tests
        run: dotnet test -c Release --no-build --filter "Zanak"

  build:
    name: Build (${{ matrix.name }})
    needs: test-and-verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: zanak-windows-x64
            ext: '.exe'
            bin: zanak.exe
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            name: zanak-linux-x64
            ext: ''
            bin: zanak
            archive: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Publish Zanak Single-File Executable
        run: |
          dotnet publish src/Zanak/Zanak.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=false \
            -o ./dist-bin

      - name: Package Windows Artifact (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item ./dist-bin/${{ matrix.bin }} -Destination ./package/${{ matrix.bin }}
          Compress-Archive -Path ./package/* -DestinationPath ./${{ matrix.name }}.zip
          $hash = (Get-FileHash -Path ./${{ matrix.name }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.name }}.zip" | Out-File -FilePath ./${{ matrix.name }}.zip.sha256 -Encoding ascii

      - name: Package Linux Artifact (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p package
          cp ./dist-bin/${{ matrix.bin }} ./package/${{ matrix.bin }}
          chmod +x ./package/${{ matrix.bin }}
          tar -czvf ./${{ matrix.name }}.tar.gz -C package .
          sha256sum ./${{ matrix.name }}.tar.gz > ./${{ matrix.name }}.tar.gz.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.*

  publish-release:
    name: Publish Zanak Pre-Release
    needs: [test-and-verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Collect Release Assets and Master SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist
          find artifacts/ -type f \( -name "zanak-*" \) -exec cp {} dist/ \;
          cd dist
          cat *.sha256 | sort -u > SHA256SUMS.txt
          ls -la

      - name: Generate Release Notes
        shell: bash
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          cat << 'EOF' > dist/release_notes.md
          # Zanak (Zap-Anak) Pre-Release: ${TAG}

          **Zanak** is an experimental sub-project within the Anak repository exploring the **ZAP** (Zero-branching Accelerated Probe) search architecture.

          Instead of recursive alpha-beta minimax trees, Zanak uses:
          - **Anytime Multi-Spine Seeding**: Immediate greedy trajectories along all legal root moves.
          - **Retrospective Discrepancy Branching**: Detecting tactical surprises along the spines and expanding prioritized discrepancy branches.
          - **Lock-free Multi-threaded Work Queue**: Dynamic allocation of background workers to high-shock crosspoints.
          - **SPSA-tunable Search & Time Parameters**: Highly customizable via UCI `setoption`.

          ### Verification & Checksums
          Refer to `SHA256SUMS.txt` for integrity verification.
          EOF
          sed -i "s/\${TAG}/${TAG}/g" dist/release_notes.md

      - name: Publish Silent GitHub Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Zanak ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: dist/release_notes.md
          files: |
            dist/*
