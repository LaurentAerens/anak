name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test-and-verify:
    name: Test & Engine Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution in Release mode
        run: dotnet build -c Release --no-restore

      - name: Run unit & regression tests
        run: |
          mkdir -p diagnostics
          dotnet test -c Release --no-build --verbosity normal | tee diagnostics/test_results.txt

      - name: Run Perft sanity check
        run: |
          dotnet run --project src/Anak.Protocol -c Release --no-build -- --perft 4 | tee diagnostics/perft_results.txt

      - name: Run NPS benchmark check
        run: |
          dotnet run --project src/Anak.Protocol -c Release --no-build -- bench | tee diagnostics/bench_results.txt

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: diagnostics/

  build:
    name: Build (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            ext: ''
            bin: anak
            archive: tar.gz
          - rid: linux-arm64
            ext: ''
            bin: anak
            archive: tar.gz
          - rid: win-x64
            ext: '.exe'
            bin: anak.exe
            archive: zip
          - rid: win-arm64
            ext: '.exe'
            bin: anak.exe
            archive: zip
          - rid: osx-x64
            ext: ''
            bin: anak
            archive: tar.gz
          - rid: osx-arm64
            ext: ''
            bin: anak
            archive: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Publish single-file self-contained executable
        run: |
          dotnet publish src/Anak.Protocol/Anak.Protocol.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -o publish/

      - name: Package binary, bundle companion assets, and compute SHA-256
        run: |
          mkdir -p asset
          TARGET_NAME="anak-${{ matrix.rid }}${{ matrix.ext }}"
          cp "publish/${{ matrix.bin }}" "asset/${TARGET_NAME}"
          chmod +x "asset/${TARGET_NAME}"

          # Stage bundle directory
          BUNDLE_DIR="anak-${{ matrix.rid }}"
          mkdir -p "${BUNDLE_DIR}"
          cp "publish/${{ matrix.bin }}" "${BUNDLE_DIR}/${{ matrix.bin }}"
          chmod +x "${BUNDLE_DIR}/${{ matrix.bin }}"

          # Copy companion neural network weights if present
          if [ -d "networks" ] && [ -n "$(find networks -maxdepth 1 -name '*.nnue' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/networks"
            cp networks/*.nnue "${BUNDLE_DIR}/networks/"
          elif [ -d "publish/networks" ] && [ -n "$(find publish/networks -maxdepth 1 -name '*.nnue' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/networks"
            cp publish/networks/*.nnue "${BUNDLE_DIR}/networks/"
          fi

          # Copy opening book if present
          if [ -f "book.bin" ]; then
            cp "book.bin" "${BUNDLE_DIR}/"
          elif [ -f "publish/book.bin" ]; then
            cp "publish/book.bin" "${BUNDLE_DIR}/"
          fi

          # Copy endgame tablebases if present
          if [ -d "syzygy" ] && [ -n "$(find syzygy -maxdepth 1 -name '*.rtb*' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/syzygy"
            cp syzygy/* "${BUNDLE_DIR}/syzygy/"
          elif [ -d "publish/syzygy" ] && [ -n "$(find publish/syzygy -maxdepth 1 -name '*.rtb*' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/syzygy"
            cp publish/syzygy/* "${BUNDLE_DIR}/syzygy/"
          fi

          # Archive bundle based on platform format (.zip for Windows, .tar.gz for Linux/macOS)
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "asset/anak-${{ matrix.rid }}.zip" "${BUNDLE_DIR}"
          else
            tar -czvf "asset/anak-${{ matrix.rid }}.tar.gz" "${BUNDLE_DIR}"
          fi

          # Compute SHA-256 checksums for each release asset
          cd asset
          for f in *; do
            if [ -f "$f" ] && [ "${f##*.}" != "sha256" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.rid }}
          path: asset/

  publish-release:
    name: Publish GitHub Release
    needs: [test-and-verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code (with history for changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release assets and generate master SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts/ -type f \( -name "anak-*" \) -exec cp {} dist/ \;
          cd dist
          cat *.sha256 | sort -u > SHA256SUMS.txt
          ls -la

      - name: Locate diagnostic logs
        id: diagnostics
        run: |
          mkdir -p logs
          find artifacts/ -type f -name "test_results.txt" -exec cp {} logs/ \; || true
          find artifacts/ -type f -name "perft_results.txt" -exec cp {} logs/ \; || true
          find artifacts/ -type f -name "bench_results.txt" -exec cp {} logs/ \; || true
          ls -la logs/

      - name: Generate Release Notes & Elo Progression Chart
        run: |
          python tools/generate_release_notes.py \
            --tag "${{ github.ref_name }}" \
            --ratings tools/fastchess/ratings.json \
            --output-notes dist/release_notes.md \
            --output-svg dist/elo_progression.svg \
            --bench-results logs/bench_results.txt \
            --test-results logs/test_results.txt \
            --perft-results logs/perft_results.txt \
            --repo "${{ github.repository }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: Anak ${{ github.ref_name }}
          body_path: dist/release_notes.md
          files: |
            dist/*
