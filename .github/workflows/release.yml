name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version to release (e.g. v1.0.9 or 1.0.9)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test-and-verify:
    name: Test & Engine Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution in Release mode
        run: dotnet build -c Release --no-restore

      - name: Run unit & regression tests
        run: |
          mkdir -p diagnostics
          dotnet test -c Release --no-build --verbosity normal | tee diagnostics/test_results.txt

      - name: Run Perft sanity check
        run: |
          dotnet run --project src/Anak.Protocol -c Release --no-build -- --perft 4 | tee diagnostics/perft_results.txt

      - name: Run NPS benchmark check
        run: |
          dotnet run --project src/Anak.Protocol -c Release --no-build -- bench | tee diagnostics/bench_results.txt

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: diagnostics/

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 NativeAOT
          - os: windows-latest
            rid: win-x64
            profile: win-x64-avx512
            target: windows-x64-avx512
            name: anak-windows-x64-avx512
            ext: '.exe'
            bin: anak.exe
            archive: zip
          - os: windows-latest
            rid: win-x64
            profile: win-x64-avx2
            target: windows-x64-avx2
            name: anak-windows-x64-avx2
            ext: '.exe'
            bin: anak.exe
            archive: zip
          - os: windows-latest
            rid: win-x64
            profile: win-x64-generic
            target: windows-x64-generic
            name: anak-windows-x64-generic
            ext: '.exe'
            bin: anak.exe
            archive: zip
          # Linux x64 NativeAOT
          - os: ubuntu-latest
            rid: linux-x64
            profile: linux-x64-avx512
            target: linux-x64-avx512
            name: anak-linux-x64-avx512
            ext: ''
            bin: anak
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-x64
            profile: linux-x64-avx2
            target: linux-x64-avx2
            name: anak-linux-x64-avx2
            ext: ''
            bin: anak
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-x64
            profile: linux-x64-generic
            target: linux-x64-generic
            name: anak-linux-x64-generic
            ext: ''
            bin: anak
            archive: tar.gz
          # macOS Apple Silicon NativeAOT
          - os: macos-latest
            rid: osx-arm64
            profile: osx-arm64
            target: macos-arm64
            name: anak-macos-arm64
            ext: ''
            bin: anak
            archive: tar.gz
          # Linux ARM64 NativeAOT
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            profile: linux-arm64
            target: linux-arm64
            name: anak-linux-arm64
            ext: ''
            bin: anak
            archive: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
          if [ "${{ matrix.rid }}" = "linux-arm64" ] && [ "$(uname -m)" != "aarch64" ]; then
            sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu || true
          fi

      - name: Publish NativeAOT executable
        shell: bash
        run: |
          dotnet publish src/Anak.Protocol/Anak.Protocol.csproj \
            -c Release \
            -p:PublishProfile=${{ matrix.profile }} \
            -o publish/

      - name: Package binary, bundle companion assets, and compute SHA-256
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi

          TARGET_NAME="anak-${TAG}-${{ matrix.target }}${{ matrix.ext }}"
          mkdir -p asset
          cp "publish/${{ matrix.bin }}" "asset/${TARGET_NAME}"
          chmod +x "asset/${TARGET_NAME}"

          # Stage bundle directory
          BUNDLE_DIR="anak-${TAG}-${{ matrix.target }}"
          mkdir -p "${BUNDLE_DIR}"
          cp "publish/${{ matrix.bin }}" "${BUNDLE_DIR}/${{ matrix.bin }}"
          cp "publish/${{ matrix.bin }}" "${BUNDLE_DIR}/${TARGET_NAME}"
          chmod +x "${BUNDLE_DIR}/${{ matrix.bin }}" "${BUNDLE_DIR}/${TARGET_NAME}"

          # Copy companion neural network weights if present
          if [ -d "networks" ] && [ -n "$(find networks -maxdepth 1 -name '*.nnue' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/networks"
            cp networks/*.nnue "${BUNDLE_DIR}/networks/"
          elif [ -d "publish/networks" ] && [ -n "$(find publish/networks -maxdepth 1 -name '*.nnue' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/networks"
            cp publish/networks/*.nnue "${BUNDLE_DIR}/networks/"
          fi

          # Copy opening book if present
          if [ -f "book.bin" ]; then
            cp "book.bin" "${BUNDLE_DIR}/"
          elif [ -f "publish/book.bin" ]; then
            cp "publish/book.bin" "${BUNDLE_DIR}/"
          fi

          # Copy endgame tablebases if present
          if [ -d "syzygy" ] && [ -n "$(find syzygy -maxdepth 1 -name '*.rtb*' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/syzygy"
            cp syzygy/* "${BUNDLE_DIR}/syzygy/"
          elif [ -d "publish/syzygy" ] && [ -n "$(find publish/syzygy -maxdepth 1 -name '*.rtb*' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/syzygy"
            cp publish/syzygy/* "${BUNDLE_DIR}/syzygy/"
          fi

          # Archive bundle based on platform format (.zip for Windows, .tar.gz for Linux/macOS)
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "asset/${BUNDLE_DIR}.zip" "${BUNDLE_DIR}"
            elif command -v zip >/dev/null 2>&1; then
              zip -r "asset/${BUNDLE_DIR}.zip" "${BUNDLE_DIR}"
            else
              python -m zipfile -c "asset/${BUNDLE_DIR}.zip" "${BUNDLE_DIR}"
            fi
          else
            tar -czvf "asset/${BUNDLE_DIR}.tar.gz" "${BUNDLE_DIR}"
          fi

          # Compute SHA-256 checksums for each release asset
          cd asset
          for f in *; do
            if [ -f "$f" ] && [ "${f##*.}" != "sha256" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.target }}
          path: asset/

  publish-release:
    name: Publish GitHub Release
    needs: [test-and-verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Checkout code (with history for changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all git tags
        shell: bash
        run: |
          git fetch --tags --force || true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release assets and generate master SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts/ -type f \( -name "anak-*" \) -exec cp {} dist/ \;
          cd dist
          cat *.sha256 | sort -u > SHA256SUMS.txt
          ls -la

      - name: Locate diagnostic logs
        id: diagnostics
        run: |
          mkdir -p logs
          find artifacts/ -type f -name "test_results.txt" -exec cp {} logs/ \; || true
          find artifacts/ -type f -name "perft_results.txt" -exec cp {} logs/ \; || true
          find artifacts/ -type f -name "bench_results.txt" -exec cp {} logs/ \; || true
          ls -la logs/

      - name: Generate Release Notes & Elo Progression Chart
        run: |
          python tools/generate_release_notes.py \
            --tag "${{ steps.release_info.outputs.tag }}" \
            --ratings tools/fastchess/ratings.json \
            --output-notes dist/release_notes.md \
            --output-svg dist/elo_progression.svg \
            --bench-results logs/bench_results.txt \
            --test-results logs/test_results.txt \
            --perft-results logs/perft_results.txt \
            --repo "${{ github.repository }}"

      - name: Ensure Release Notes Exist
        shell: bash
        run: |
          if [ ! -f dist/release_notes.md ] || [ ! -s dist/release_notes.md ]; then
            mkdir -p dist
            echo "# Anak ${{ steps.release_info.outputs.tag }}" > dist/release_notes.md
            echo "" >> dist/release_notes.md
            echo "Release ${{ steps.release_info.outputs.tag }} of the Anak Chess Engine." >> dist/release_notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Anak ${{ steps.release_info.outputs.tag }}
          draft: false
          make_latest: true
          generate_release_notes: false
          body_path: dist/release_notes.md
          files: |
            dist/*
