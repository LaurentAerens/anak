name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            ext: ''
            bin: anak
          - rid: linux-arm64
            ext: ''
            bin: anak
          - rid: win-x64
            ext: '.exe'
            bin: anak.exe
          - rid: win-arm64
            ext: '.exe'
            bin: anak.exe
          - rid: osx-x64
            ext: ''
            bin: anak
          - rid: osx-arm64
            ext: ''
            bin: anak

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Publish single-file self-contained executable
        run: |
          dotnet publish src/Anak.Protocol/Anak.Protocol.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -o publish/

      - name: Package binary and compute SHA-256
        run: |
          mkdir -p asset
          TARGET_NAME="anak-${{ matrix.rid }}${{ matrix.ext }}"
          cp publish/${{ matrix.bin }} asset/${TARGET_NAME}
          chmod +x asset/${TARGET_NAME}
          cd asset
          sha256sum ${TARGET_NAME} > ${TARGET_NAME}.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.rid }}
          path: asset/

  publish-release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets and generate master SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts/ -type f \( -name "anak-*" \) -exec cp {} dist/ \;
          cd dist
          cat *.sha256 | sort -u > SHA256SUMS.txt
          ls -la

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Anak ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
