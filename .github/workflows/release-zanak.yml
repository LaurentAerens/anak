name: Release Zanak

on:
  push:
    tags:
      - 'zanak-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Zanak release tag (e.g. zanak-v0.0.1)'
        required: false
        default: 'zanak-v0.0.1'

permissions:
  contents: write

jobs:
  test-and-verify:
    name: Test & Verify Zanak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution in Release mode
        run: dotnet build -c Release --no-restore

      - name: Run unit & regression tests
        run: dotnet test -c Release --no-build --verbosity normal

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            target: windows-x64
            name: zanak-windows-x64
            ext: '.exe'
            bin: zanak.exe
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            target: linux-x64
            name: zanak-linux-x64
            ext: ''
            bin: zanak
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            target: osx-arm64
            name: zanak-macos-arm64
            ext: ''
            bin: zanak
            archive: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            target: linux-arm64
            name: zanak-linux-arm64
            ext: ''
            bin: zanak
            archive: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET SDK 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Zanak NativeAOT executable
        shell: bash
        run: |
          dotnet publish src/Zanak/Zanak.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishAot=true \
            -o publish/

      - name: Package binary, bundle networks, and compute SHA-256
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          VER="${TAG#zanak-}"

          TARGET_NAME="zanak-${VER}-${{ matrix.target }}${{ matrix.ext }}"
          mkdir -p asset
          cp "publish/${{ matrix.bin }}" "asset/${TARGET_NAME}"
          chmod +x "asset/${TARGET_NAME}"

          BUNDLE_DIR="zanak-${VER}-${{ matrix.target }}"
          mkdir -p "${BUNDLE_DIR}"
          cp "publish/${{ matrix.bin }}" "${BUNDLE_DIR}/${{ matrix.bin }}"
          cp "publish/${{ matrix.bin }}" "${BUNDLE_DIR}/${TARGET_NAME}"
          chmod +x "${BUNDLE_DIR}/${{ matrix.bin }}" "${BUNDLE_DIR}/${TARGET_NAME}"

          if [ -d "networks" ] && [ -n "$(find networks -maxdepth 1 -name '*.nnue' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/networks"
            cp networks/*.nnue "${BUNDLE_DIR}/networks/"
          elif [ -d "publish/networks" ] && [ -n "$(find publish/networks -maxdepth 1 -name '*.nnue' -print -quit 2>/dev/null)" ]; then
            mkdir -p "${BUNDLE_DIR}/networks"
            cp publish/networks/*.nnue "${BUNDLE_DIR}/networks/"
          fi

          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "asset/${BUNDLE_DIR}.zip" "${BUNDLE_DIR}"
            elif command -v zip >/dev/null 2>&1; then
              zip -r "asset/${BUNDLE_DIR}.zip" "${BUNDLE_DIR}"
            else
              python -m zipfile -c "asset/${BUNDLE_DIR}.zip" "${BUNDLE_DIR}"
            fi
          else
            tar -czvf "asset/${BUNDLE_DIR}.tar.gz" "${BUNDLE_DIR}"
          fi

          cd asset
          for f in *; do
            if [ -f "$f" ] && [ "${f##*.}" != "sha256" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.target }}
          path: asset/

  publish-release:
    name: Publish Zanak GitHub Release
    needs: [test-and-verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          VER="${TAG#zanak-}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "ver=${VER}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Collect release assets and generate master SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist
          find artifacts/ -type f -name "zanak-*" -exec cp {} dist/ \;
          cd dist
          cat *.sha256 | sort -u > SHA256SUMS.txt
          ls -la

      - name: Select Zanak Release Notes
        shell: bash
        run: |
          NOTES_FILE="ZANAK_RELEASE_${{ steps.release_info.outputs.ver }}.md"
          if [ -f "${NOTES_FILE}" ]; then
            cp "${NOTES_FILE}" dist/release_notes.md
          else
            echo "# Zanak ${{ steps.release_info.outputs.ver }}" > dist/release_notes.md
            echo "" >> dist/release_notes.md
            echo "Release ${{ steps.release_info.outputs.tag }} of the Zanak ZAP Chess Engine." >> dist/release_notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Zanak ${{ steps.release_info.outputs.ver }}
          draft: false
          make_latest: false
          generate_release_notes: false
          body_path: dist/release_notes.md
          files: |
            dist/*
